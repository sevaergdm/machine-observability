data_dir  = "/tmp/lib/machine-observability/data"
state_dir = "/tmp/lib/machine-observability/state"

[collectors.journal]
enabled = true

[collectors.cpu]
enabled = true
interval = "10s"

[collectors.memory]
enabled = true
interval = "10s"

[collectors.disk]
enabled = true
interval = "60s"

[collectors.network]
enabled = true
interval = "60s"
