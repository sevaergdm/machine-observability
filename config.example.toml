data_dir  = "/var/lib/machine-observability/data"
state_dir = "/var/lib/machine-observability/state"
log_level = "info"

[collectors.journal]
enabled = true

[collectors.cpu]
enabled = true
interval = "10s"

[collectors.memory]
enabled = true
interval = "10s"

[collectors.disk]
enabled = true
interval = "60s"

[collectors.network]
enabled = true
interval = "60s"

[collectors.gpu]
enabled = true
interval = "15s"
